<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PITCH Markets</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d1117; color: #e6edf3; font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 14px;
}
a { color: #58a6ff; text-decoration: none; }

.header {
  background: #161b22; border-bottom: 1px solid #30363d; padding: 12px 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.header h1 { font-size: 18px; color: #58a6ff; }
.header .status { font-size: 12px; color: #8b949e; }
.header .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3fb950; margin-right: 6px; }
.header .status .dot.disconnected { background: #f85149; }

.container { display: flex; height: calc(100vh - 49px); }

.sidebar {
  width: 420px; min-width: 420px; border-right: 1px solid #30363d;
  overflow-y: auto; background: #0d1117;
}
.sidebar-header {
  padding: 12px 16px; border-bottom: 1px solid #30363d; background: #161b22;
  font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px;
  position: sticky; top: 0; z-index: 2;
}
.search-box {
  padding: 8px 16px; border-bottom: 1px solid #30363d; background: #161b22;
  position: sticky; top: 36px; z-index: 2;
}
.search-box input {
  width: 100%; padding: 6px 10px; background: #0d1117; border: 1px solid #30363d;
  border-radius: 6px; color: #e6edf3; font-family: inherit; font-size: 13px;
  outline: none;
}
.search-box input:focus { border-color: #58a6ff; }

.filter-bar {
  display: flex; gap: 4px; padding: 8px 16px; border-bottom: 1px solid #30363d;
  background: #161b22; position: sticky; top: 72px; z-index: 2; flex-wrap: wrap;
  align-items: center;
}
.filter-btn {
  padding: 3px 10px; border: 1px solid #30363d; border-radius: 4px;
  background: transparent; color: #8b949e; font-family: inherit;
  font-size: 11px; cursor: pointer; transition: all 0.15s;
}
.filter-btn:hover { border-color: #58a6ff; color: #e6edf3; }
.filter-btn.active { background: #58a6ff; color: #0d1117; border-color: #58a6ff; font-weight: 600; }
.filter-btn.role-best.active { background: #f0883e; border-color: #f0883e; }
.filter-btn.role-captain.active { background: #58a6ff; border-color: #58a6ff; }
.filter-btn.role-rookie.active { background: #3fb950; border-color: #3fb950; }
.filter-separator {
  width: 1px; height: 18px; background: #30363d; margin: 0 4px;
}
.chg-btn {
  padding: 3px 8px; border: 1px solid #30363d; border-radius: 4px;
  background: transparent; color: #8b949e; font-family: inherit;
  font-size: 10px; cursor: pointer; transition: all 0.15s;
}
.chg-btn:hover { border-color: #d2a8ff; color: #e6edf3; }
.chg-btn.active { background: #8b5cf6; color: #fff; border-color: #8b5cf6; font-weight: 600; }

.player-row {
  display: grid; grid-template-columns: 1fr 55px 120px 55px;
  padding: 10px 16px; border-bottom: 1px solid #21262d; cursor: pointer;
  transition: background 0.15s;
}
.player-row:hover { background: #161b22; }
.player-row.active { background: #1c2333; border-left: 3px solid #58a6ff; }

.player-name { font-weight: 600; font-size: 13px; }
.player-country { font-size: 11px; color: #8b949e; margin-top: 2px; }
.role-tag {
  display: inline-block; font-size: 9px; padding: 1px 5px; border-radius: 3px;
  margin-left: 6px; font-weight: 600; text-transform: uppercase; vertical-align: middle;
}
.role-tag.best { background: rgba(240,136,62,0.2); color: #f0883e; }
.role-tag.captain { background: rgba(88,166,255,0.2); color: #58a6ff; }
.role-tag.rookie { background: rgba(63,185,80,0.2); color: #3fb950; }

.player-cell { text-align: right; font-size: 13px; display: flex; flex-direction: column; justify-content: center; }
.player-cell .price-main { font-size: 13px; }
.player-cell .price-sub { font-size: 10px; color: #8b949e; margin-top: 1px; }
.change-up { color: #3fb950; }
.change-down { color: #f85149; }
.change-zero { color: #8b949e; }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.chart-header {
  padding: 16px 24px; border-bottom: 1px solid #30363d; background: #161b22;
  display: flex; align-items: center; gap: 24px;
}
.chart-header .player-title { font-size: 20px; font-weight: 700; }
.chart-header .player-meta { font-size: 13px; color: #8b949e; }
.chart-header .price-big-wrap { margin-left: auto; text-align: right; }
.chart-header .price-big { font-size: 28px; font-weight: 700; color: #3fb950; }
.chart-header .price-sub-big { font-size: 14px; color: #8b949e; margin-top: 2px; }

.tf-bar {
  display: flex; gap: 4px; padding: 8px 24px; background: #161b22;
  border-bottom: 1px solid #30363d; align-items: center; flex-wrap: wrap;
}
.tf-btn, .chart-type-btn, .price-toggle-btn {
  padding: 4px 12px; border: 1px solid #30363d; border-radius: 4px;
  background: transparent; color: #8b949e; font-family: inherit;
  font-size: 12px; cursor: pointer; transition: all 0.15s;
}
.tf-btn:hover, .chart-type-btn:hover { border-color: #58a6ff; color: #e6edf3; }
.tf-btn.active { background: #58a6ff; color: #0d1117; border-color: #58a6ff; font-weight: 600; }
.chart-type-btn.active { background: #388bfd; color: #fff; border-color: #388bfd; font-weight: 600; }
.price-toggle-btn:hover { border-color: #d2a8ff; color: #e6edf3; }
.price-toggle-btn.active { background: #8b5cf6; color: #fff; border-color: #8b5cf6; font-weight: 600; }

.tf-separator { width: 1px; height: 20px; background: #30363d; margin: 0 8px; }

.chart-area { flex: 1; min-height: 300px; position: relative; }

.tooltip {
  position: absolute; top: 12px; left: 12px; z-index: 10;
  background: rgba(22,27,34,0.92); border: 1px solid #30363d; border-radius: 6px;
  padding: 8px 12px; pointer-events: none; display: none; font-size: 12px;
  min-width: 180px;
}
.tooltip .tt-time { color: #8b949e; margin-bottom: 4px; }
.tooltip .tt-price { font-weight: 600; font-size: 14px; }
.tooltip .tt-ohlc { color: #8b949e; margin-top: 4px; }

.stats-bar {
  display: flex; gap: 32px; padding: 12px 24px; border-top: 1px solid #30363d;
  background: #161b22;
}
.stat { display: flex; flex-direction: column; }
.stat .stat-label { font-size: 11px; color: #8b949e; text-transform: uppercase; }
.stat .stat-value { font-size: 16px; font-weight: 600; margin-top: 2px; }

.trades-section { border-top: 1px solid #30363d; max-height: 280px; overflow-y: auto; }
.trades-tabs {
  display: flex; gap: 0; background: #161b22; border-bottom: 1px solid #30363d;
  position: sticky; top: 0; z-index: 1;
}
.trades-tab {
  padding: 8px 24px; font-size: 12px; color: #8b949e; cursor: pointer;
  text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid transparent;
  transition: all 0.15s; background: none; border-top: none; border-left: none; border-right: none;
  font-family: inherit;
}
.trades-tab:hover { color: #e6edf3; }
.trades-tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
.trades-tab .tab-count { color: #8b949e; font-size: 10px; margin-left: 4px; }
.trade-row {
  display: grid; grid-template-columns: 40px 75px 65px 75px 80px 90px 70px;
  column-gap: 18px;
  padding: 5px 16px; border-bottom: 1px solid #21262d; font-size: 11px;
  align-items: center;
}
.trade-row span { text-align: right; }
.trade-row span:first-child { text-align: left; }
.trade-row .buy { color: #3fb950; font-weight: 600; }
.trade-row .sell { color: #f85149; font-weight: 600; }
.trade-row .tx-link { color: #8b949e; }
.trade-row .tx-link:hover { color: #58a6ff; }
.trade-row .wallet-pos { color: #8b949e; font-size: 10px; }
.wallet-row {
  display: grid; grid-template-columns: 100px 50px 50px 80px 80px 80px;
  column-gap: 18px;
  padding: 5px 16px; border-bottom: 1px solid #21262d; font-size: 11px;
  align-items: center;
}
.wallet-row span { text-align: right; }
.wallet-row span:first-child { text-align: left; }
.wallet-row .pos-positive { color: #3fb950; font-weight: 600; }
.wallet-row .pos-zero { color: #8b949e; }
.trades-col-header {
  display: grid; column-gap: 18px; padding: 4px 16px; font-size: 10px; color: #8b949e;
  border-bottom: 1px solid #30363d; background: #0d1117;
  position: sticky; top: 38px; z-index: 1;
}
.trades-col-header span { text-align: right; }
.trades-col-header span:first-child { text-align: left; }
.trades-col-header.trades-cols { grid-template-columns: 40px 75px 65px 75px 80px 90px 70px; }
.trades-col-header.wallets-cols { grid-template-columns: 100px 50px 50px 80px 80px 80px; }
.trades-col-header.orders-cols { grid-template-columns: 44px 72px 70px 58px 1fr 104px; column-gap: 12px; }

/* My Wallet tab */
.mw-section { padding: 12px 16px 4px; }
.mw-head { font-size: 11px; color: #8b949e; margin-bottom: 10px; }
.mw-head a { color: #58a6ff; }
.mw-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.mw-cell {
  background: #161b22; border: 1px solid #21262d; border-radius: 6px; padding: 8px 10px;
}
.mw-cell .mw-label {
  font-size: 9px; color: #8b949e; text-transform: uppercase; letter-spacing: .5px;
}
.mw-cell .mw-value { font-size: 14px; font-weight: 600; color: #e6edf3; margin-top: 3px; }
.mw-cell .mw-value.pos { color: #3fb950; }
.mw-cell .mw-value.neg { color: #f85149; }
.mw-cell .mw-sub { font-size: 10px; color: #8b949e; margin-top: 2px; }
.mw-cell .mw-sub.pos { color: #3fb950; }
.mw-cell .mw-sub.neg { color: #f85149; }
.mw-trades-title {
  font-size: 10px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px;
  padding: 10px 16px 4px;
}
.mw-trade-row {
  display: grid; grid-template-columns: 40px 1fr 1fr 1fr 1fr 78px;
  column-gap: 12px; padding: 4px 16px; border-bottom: 1px solid #21262d;
  font-size: 11px; align-items: center;
}
.mw-trade-row span { text-align: right; }
.mw-trade-row span:first-child { text-align: left; }
.mw-trade-row .buy { color: #3fb950; font-weight: 600; }
.mw-trade-row .sell { color: #f85149; font-weight: 600; }
.mw-trade-head { font-size: 9px; text-transform: uppercase; color: #8b949e; border-bottom: 1px solid #30363d; }
.mw-trade-head span { color: #8b949e; }

/* Orders tab */
.orders-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; border-bottom: 1px solid #21262d; background: #0d1117;
  position: sticky; top: 38px; z-index: 1;
}
.orders-bar .ob-info { font-size: 11px; color: #8b949e; }
.arm-toggle {
  display: flex; align-items: center; gap: 8px; font-size: 11px;
  text-transform: uppercase; letter-spacing: .5px; cursor: pointer;
  background: none; border: none; font-family: inherit; color: #8b949e;
}
.arm-switch {
  width: 36px; height: 18px; border-radius: 9px; background: #30363d;
  position: relative; transition: background 0.15s;
}
.arm-switch::after {
  content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
  border-radius: 50%; background: #8b949e; transition: all 0.15s;
}
.arm-toggle.on .arm-switch { background: #238636; }
.arm-toggle.on .arm-switch::after { left: 20px; background: #fff; }
.arm-toggle.on { color: #3fb950; }
.orders-warn { padding: 6px 16px; font-size: 11px; color: #d29922; background: rgba(210,153,34,0.1); }
.order-row {
  display: grid; grid-template-columns: 44px 72px 70px 58px 1fr 104px;
  column-gap: 12px; padding: 6px 16px; border-bottom: 1px solid #21262d;
  font-size: 11px; align-items: center;
}
.order-row span { text-align: right; white-space: nowrap; }
.order-row .o-player { text-align: left; font-weight: 600; color: #e6edf3; cursor: pointer; }
.order-row .o-player:hover { color: #58a6ff; }
.order-row.is-review { background: rgba(210,153,34,0.07); }
.order-kind {
  text-align: center; font-size: 9px; font-weight: 700; padding: 2px 0;
  border-radius: 3px; text-transform: uppercase; letter-spacing: .5px;
}
.order-kind.limit { background: rgba(63,185,80,0.15); color: #3fb950; }
.order-kind.tp { background: rgba(63,185,80,0.15); color: #3fb950; }
.o-status { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
.o-status.pending { color: #d29922; }
.o-status.executing { color: #58a6ff; }
.o-status.filled { color: #3fb950; }
.o-status.failed { color: #f85149; }
.o-status.cancelled { color: #6e7681; }
.o-status.review { color: #d29922; font-weight: 700; }
.o-status a { color: inherit; text-decoration: underline; }
.order-acts { display: flex; gap: 4px; justify-content: flex-end; }
.order-btn {
  background: none; border: 1px solid #30363d; border-radius: 4px; color: #8b949e;
  cursor: pointer; font-family: inherit; font-size: 10px; line-height: 1;
  padding: 4px 7px;
}
.order-btn.exec { color: #3fb950; border-color: rgba(63,185,80,0.5); }
.order-btn.exec:hover { background: rgba(63,185,80,0.15); }
.order-btn.cxl { color: #8b949e; }
.order-btn.cxl:hover { border-color: #f85149; color: #f85149; }
.order-toast {
  position: fixed; bottom: 20px; right: 20px; z-index: 100;
  padding: 12px 16px; border-radius: 6px; font-size: 13px; font-weight: 600;
  background: #161b22; border: 1px solid #30363d; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  opacity: 0; transform: translateY(10px); transition: all 0.25s; pointer-events: none;
}
.order-toast.show { opacity: 1; transform: translateY(0); }
.order-toast.filled { border-color: #3fb950; color: #3fb950; }
.order-toast.failed { border-color: #f85149; color: #f85149; }

/* Review modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200;
  display: none; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #161b22; border: 1px solid #30363d; border-radius: 8px;
  width: 470px; max-width: 92vw; max-height: 82vh; overflow-y: auto;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
}
.modal-head {
  padding: 14px 18px; border-bottom: 1px solid #30363d;
  font-size: 14px; font-weight: 700; color: #d29922;
}
.modal-body { padding: 14px 18px; font-size: 12px; color: #8b949e; }
.modal-order {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid #21262d;
}
.modal-order:last-child { border-bottom: none; }
.modal-order .mo-info { color: #e6edf3; font-weight: 600; }
.modal-order .mo-sub { color: #f85149; font-size: 11px; margin-top: 3px; }
.modal-foot { padding: 12px 18px; border-top: 1px solid #30363d; text-align: right; }
.modal-btn {
  background: #21262d; border: 1px solid #30363d; border-radius: 5px; color: #e6edf3;
  font-family: inherit; font-size: 12px; padding: 7px 14px; cursor: pointer;
}
.modal-btn:hover { border-color: #58a6ff; }

/* Wallet chip + profile view */
.header-right { display: flex; align-items: center; gap: 16px; }
.wallet-chip {
  display: flex; align-items: center; gap: 6px; cursor: pointer;
  background: #21262d; border: 1px solid #30363d; border-radius: 16px;
  color: #e6edf3; font-family: inherit; font-size: 12px; padding: 5px 13px;
}
.wallet-chip:hover { border-color: #58a6ff; }
.wallet-chip.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }

#profile-view { display: none; flex: 1; overflow-y: auto; padding: 18px 24px; }
body.mode-profile .chart-header,
body.mode-profile #tf-bar,
body.mode-profile #chart-area,
body.mode-profile .stats-bar,
body.mode-profile #trades-section,
body.mode-profile #trade-panel { display: none; }
body.mode-profile #profile-view { display: block; }

.pf-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.pf-head .pf-title { font-size: 18px; font-weight: 700; }
.pf-head .pf-addr { font-size: 12px; color: #8b949e; }
.pf-head .pf-actions { margin-left: auto; display: flex; gap: 8px; }
.pf-btn {
  background: #21262d; border: 1px solid #30363d; border-radius: 5px; color: #e6edf3;
  font-family: inherit; font-size: 12px; padding: 6px 12px; cursor: pointer;
}
.pf-btn:hover { border-color: #58a6ff; }
.pf-section { margin-bottom: 22px; }
.pf-section h3 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  color: #8b949e; margin: 0 0 10px;
}
.pf-cards { display: flex; gap: 10px; flex-wrap: wrap; }
.pf-card {
  background: #161b22; border: 1px solid #21262d; border-radius: 8px;
  padding: 12px 14px; min-width: 130px; flex: 1;
}
.pf-card .pf-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: #8b949e;
}
.pf-card .pf-value { font-size: 20px; font-weight: 700; color: #e6edf3; margin-top: 4px; }
.pf-card .pf-sub { font-size: 11px; color: #8b949e; margin-top: 3px; }
.pf-pos { color: #3fb950; }
.pf-neg { color: #f85149; }
.pf-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.pf-table th {
  text-align: right; font-size: 10px; text-transform: uppercase; color: #8b949e;
  letter-spacing: .5px; padding: 6px 8px; border-bottom: 1px solid #30363d;
}
.pf-table td { text-align: right; padding: 6px 8px; border-bottom: 1px solid #21262d; }
.pf-table th:first-child, .pf-table td:first-child { text-align: left; }
.pf-table tbody tr.clickable { cursor: pointer; }
.pf-table tbody tr.clickable:hover { background: #161b22; }
.pf-table .sym { font-weight: 600; color: #e6edf3; }
.pf-table a { color: #8b949e; }
.pf-table a:hover { color: #58a6ff; }
.pf-alloc-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 12px; }
.pf-alloc-row .pf-alloc-label { width: 96px; color: #e6edf3; }
.pf-alloc-bar { flex: 1; height: 14px; background: #21262d; border-radius: 3px; overflow: hidden; }
.pf-alloc-bar > div { height: 100%; background: #1f6feb; }
.pf-alloc-row .pf-alloc-val { width: 130px; text-align: right; color: #8b949e; }
.pf-chart { height: 220px; background: #0d1117; border: 1px solid #21262d; border-radius: 8px; }
.pf-empty { color: #8b949e; font-size: 12px; padding: 10px 2px; }

.no-data { padding: 60px; text-align: center; color: #8b949e; font-size: 16px; }
.loading { text-align: center; padding: 40px; color: #8b949e; }

/* Trade panel */
.trade-panel {
  width: 280px; min-width: 280px; border-left: 1px solid #30363d;
  background: #0d1117; display: flex; flex-direction: column; overflow-y: auto;
}
.trade-panel-header {
  padding: 12px 16px; border-bottom: 1px solid #30363d; background: #161b22;
  font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px;
}
.trade-wallet {
  padding: 10px 16px; border-bottom: 1px solid #30363d; font-size: 11px;
}
.trade-wallet .wallet-addr { color: #58a6ff; font-weight: 600; }
.trade-wallet .wallet-bal { color: #8b949e; margin-top: 4px; }
.trade-wallet .wallet-bal span { color: #e6edf3; font-weight: 600; }
.trade-no-wallet { padding: 16px; color: #f0883e; font-size: 12px; text-align: center; }

.trade-sides { display: flex; border-bottom: 1px solid #30363d; }
.trade-side-btn {
  flex: 1; padding: 10px; text-align: center; font-family: inherit;
  font-size: 13px; font-weight: 700; cursor: pointer; border: none;
  transition: all 0.15s; background: #161b22; color: #8b949e;
}
.trade-side-btn:hover { color: #e6edf3; }
.trade-side-btn.buy-active { background: rgba(63,185,80,0.15); color: #3fb950; border-bottom: 2px solid #3fb950; }
.trade-side-btn.sell-active { background: rgba(248,81,73,0.15); color: #f85149; border-bottom: 2px solid #f85149; }

/* Market / Limit mode toggle */
.trade-mode { display: flex; gap: 4px; padding: 8px 16px 0; }
.trade-mode-btn {
  flex: 1; padding: 6px; font-family: inherit; font-size: 11px; font-weight: 600;
  letter-spacing: 1px; cursor: pointer; border: 1px solid #30363d; border-radius: 5px;
  background: transparent; color: #8b949e; transition: all 0.15s;
}
.trade-mode-btn:hover { color: #e6edf3; }
.trade-mode-btn.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }
.limit-hint {

<script>
let chart = null;
let mainSeries = null;
let playersData = [];
let countriesData = [];
let countryPrices = {};
let selectedAddr = null;
let currentTf = '5m';
let chartMode = 'line';
let priceUnit = 'country';
let roleFilter = 'best';
let chgPeriod = '1d';
let listMode = 'players';
let lastChartData = null;
let sseSource = null;
let lastLiveCandle = null;
let currentChartMode = null;
let showMyTrades = true;
let showAllTrades = false;
let showAvgBuy = false;
let showAvgNet = true;
let avgBuyLine = null;
let avgNetLine = null;
let walletAddress = '';
let lastSeriesTime = 0;

function formatTime(ts) {
  const d = new Date(ts * 1000);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return `${Math.floor(diff)}s ago`;
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
}

function formatDate(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
    ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}

// Returns the selected token — a player OR a country.
function getSelectedPlayer() {
  return playersData.find(p => p.address === selectedAddr)
      || countriesData.find(c => c.address === selectedAddr)
      || null;
}

function isCountrySelected() {
  const t = getSelectedPlayer();
  return !!t && t.kind === 'country';
}

// Label for the price axis / tooltips given the current selection + unit toggle.
function unitLabel() {
  if (isCountrySelected()) return 'PITCH';
  const p = getSelectedPlayer();
  return priceUnit === 'pitch' ? 'PITCH' : (p ? p.country : '?');
}

function getPitchMultiplier() {
  const player = getSelectedPlayer();
  if (!player) return 0;
  return countryPrices[player.country] || 0;
}

function applyPitchMultiplier(value) {
  if (isCountrySelected()) return value;   // country chart values are already in PITCH
  if (priceUnit !== 'pitch') return value;
  const m = getPitchMultiplier();
  return m > 0 ? value * m : value;
}

function createChart() {
  const container = document.getElementById('chart-area');
  if (chart) { chart.remove(); chart = null; mainSeries = null; }

  chart = LightweightCharts.createChart(container, {
    layout: {
      background: { color: '#0d1117' },
      textColor: '#8b949e',
      fontFamily: "'SF Mono', 'Fira Code', monospace",
      fontSize: 11,
    },
    grid: {
      vertLines: { color: '#21262d' },
      horzLines: { color: '#21262d' },
    },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color: '#58a6ff', width: 1, style: 2, labelBackgroundColor: '#161b22' },
      horzLine: { color: '#58a6ff', width: 1, style: 2, labelBackgroundColor: '#161b22' },
    },
    rightPriceScale: {
      borderColor: '#30363d',
      scaleMargins: { top: 0.1, bottom: 0.05 },
    },
    timeScale: {
      borderColor: '#30363d',
      timeVisible: true,
      secondsVisible: false,
    },
    handleScroll: true,
    handleScale: true,
  });

  if (chartMode === 'candles') {
    mainSeries = chart.addCandlestickSeries({
      upColor: '#3fb950',
      downColor: '#f85149',
      borderUpColor: '#3fb950',
      borderDownColor: '#f85149',
      wickUpColor: '#3fb950',
      wickDownColor: '#f85149',
    });
  } else {
    mainSeries = chart.addLineSeries({
      color: '#58a6ff',
      lineWidth: 2,
      crosshairMarkerVisible: true,
      crosshairMarkerRadius: 4,
      lastValueVisible: true,
      priceLineVisible: true,
    });
  }

  // Tooltip
  chart.subscribeCrosshairMove(param => {
    const tooltip = document.getElementById('tooltip');
    if (!param.time || !param.seriesData || !param.seriesData.size) {
      tooltip.style.display = 'none';
      return;
    }
    const data = param.seriesData.get(mainSeries);
    if (!data) { tooltip.style.display = 'none'; return; }

    const unit = unitLabel();

    tooltip.style.display = 'block';
    document.getElementById('tt-time').textContent = formatDate(param.time);

    if (chartMode === 'candles' && data.open !== undefined) {
      document.getElementById('tt-price').textContent = `Close: ${data.close.toFixed(6)} ${unit}`;
      document.getElementById('tt-ohlc').textContent =
        `O: ${data.open.toFixed(6)}  H: ${data.high.toFixed(6)}  L: ${data.low.toFixed(6)}`;
    } else {
      document.getElementById('tt-price').textContent = `${data.value.toFixed(6)} ${unit}`;
      document.getElementById('tt-ohlc').textContent = '';
    }
  });

  const ro = new ResizeObserver(() => {
    chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
  });
  ro.observe(container);
}

async function fetchPlayers() {
  try {
    const res = await fetch('/api/players');
    const data = await res.json();
    playersData = data.players;
    countriesData = data.countries || [];
    countryPrices = data.countryPrices || {};
    walletAddress = data.walletAddress || '';
    document.getElementById('status-text').textContent =
      `${playersData.length} players | ${countriesData.length} countries | ${new Date(data.lastUpdate * 1000).toLocaleTimeString()}`;
    const chip = document.getElementById('wallet-chip');
    if (walletAddress) {
      chip.style.display = 'flex';
      chip.textContent = '👤 ' + walletAddress.slice(0, 6) + '..' + walletAddress.slice(-4);
    }
    renderPlayerList();
    updateHeaderPrice();
  } catch(e) {}
}

function updateHeaderPrice() {
  if (!selectedAddr) return;
  const tok = getSelectedPlayer();
  if (!tok) return;

  const priceEl = document.getElementById('ch-price');
  const subEl = document.getElementById('ch-price-sub');

  if (tok.kind === 'country') {
    if (tok.pricePitch > 0) {
      priceEl.textContent = `${tok.pricePitch.toFixed(4)} PITCH`;
      priceEl.style.color = '#3fb950';
    } else {
      priceEl.textContent = '\u2014';
      priceEl.style.color = '#8b949e';
    }
    subEl.textContent = '';
  } else {
    if (tok.priceCountry > 0) {
      priceEl.textContent = `${tok.priceCountry.toFixed(4)} ${tok.country}`;
      priceEl.style.color = '#3fb950';
      subEl.textContent = tok.pricePitch > 0 ? `${tok.pricePitch.toFixed(4)} PITCH` : '';
    } else {
      priceEl.textContent = '\u2014';
      priceEl.style.color = '#8b949e';
      subEl.textContent = '';
    }
  }
  document.getElementById('st-supply').textContent = tok.supply.toFixed(2);
}

function getChg(p, period) {
  if (!p.changePct) return 0;
  if (typeof p.changePct === 'number') return p.changePct; // fallback
  return p.changePct[period || chgPeriod] || 0;
}

function chgCell(chg) {
  const cls = chg > 0 ? 'change-up' : chg < 0 ? 'change-down' : 'change-zero';
  const str = chg > 0 ? `+${chg.toFixed(1)}%` : chg < 0 ? `${chg.toFixed(1)}%` : '&mdash;';
  return `<span class="${cls}">${str}</span>`;
}

function renderPlayerList() {
  const list = document.getElementById('player-list');
  const f = (document.getElementById('search').value || '').toLowerCase();
  document.getElementById('col-header-first').textContent =
    listMode === 'countries' ? 'Country' : 'Player';

  if (listMode === 'countries') {
    // Countries: no role filter, sorted by price (server sorts descending).
    // The change% period selector still applies via getChg(c) -> chgPeriod.
    const filtered = countriesData.filter(c =>
      !f || c.name.toLowerCase().includes(f) || c.symbol.toLowerCase().includes(f));

    list.innerHTML = filtered.map(c => `
    <div class="player-row ${selectedAddr === c.address ? 'active' : ''}" onclick="selectPlayer('${c.address}')">
      <div>
        <div class="player-name">${c.name}</div>
        <div class="player-country">${c.symbol}</div>
      </div>
      <div class="player-cell">${c.supply.toFixed(1)}</div>
      <div class="player-cell">
        <span class="price-main">${c.pricePitch > 0 ? c.pricePitch.toFixed(4) + ' PITCH' : '&mdash;'}</span>
      </div>
      <div class="player-cell">${chgCell(getChg(c))}</div>
    </div>`).join('') || '<div class="no-data">No countries</div>';
    return;
  }

  const filtered = playersData.filter(p => {
    if (roleFilter !== 'all' && p.role !== roleFilter) return false;
    if (f && !p.name.toLowerCase().includes(f) && !p.symbol.toLowerCase().includes(f) && !p.country.toLowerCase().includes(f)) return false;
    return true;
  });

  list.innerHTML = filtered.map(p => {
    const pitchStr = p.pricePitch > 0 ? `${p.pricePitch.toFixed(4)} PITCH` : '';
    const roleTag = p.role ? `<span class="role-tag ${p.role}">${p.role[0].toUpperCase()}</span>` : '';
    return `
    <div class="player-row ${selectedAddr === p.address ? 'active' : ''}" onclick="selectPlayer('${p.address}')">
      <div>
        <div class="player-name">${p.name}${roleTag}</div>
        <div class="player-country">${p.country} &mdash; ${p.countryName}</div>
      </div>
      <div class="player-cell">${p.supply.toFixed(1)}</div>
      <div class="player-cell">
        <span class="price-main">${p.priceCountry > 0 ? p.priceCountry.toFixed(4) + ' ' + p.country : '&mdash;'}</span>
        <span class="price-sub">${pitchStr}</span>
      </div>
      <div class="player-cell">${chgCell(getChg(p))}</div>
    </div>`;
  }).join('');
}

async function selectPlayer(addr) {
  if (profileOpen) closeProfile();   // picking a token exits the wallet profile
  selectedAddr = addr;
  lastLiveCandle = null;
  currentChartMode = null;
  tradesData = null;   // clear stale trades so avg lines don't flash wrong values
  renderPlayerList();

  const tok = getSelectedPlayer();
  if (!tok) return;
  const isCountry = tok.kind === 'country';

  document.getElementById('ch-name').textContent = `${tok.name} (${tok.symbol})`;
  document.getElementById('ch-meta').textContent = isCountry
    ? 'Country token' : `${tok.country} \u2014 ${tok.countryName}`;

  // Country prices are always in PITCH \u2014 the Country/PITCH unit toggle only applies to players.
  const unitWrap = document.getElementById('unit-toggle-wrap');
  if (isCountry) {
    unitWrap.style.display = 'none';
  } else {
    unitWrap.style.display = 'contents';
    document.getElementById('btn-country').textContent = tok.country;
  }

  updateHeaderPrice();

  document.getElementById('st-country').textContent = isCountry
    ? '\u2014' : `${tok.country} \u2014 ${tok.countryName}`;
  document.getElementById('st-role').textContent = isCountry
    ? '\u2014' : (tok.role ? tok.role.charAt(0).toUpperCase() + tok.role.slice(1) : '\u2014');
  document.getElementById('st-trades').textContent = tok.trades;
  document.getElementById('st-contract').innerHTML =
    `<a href="https://basescan.org/address/${addr}" target="_blank">${addr.slice(0,6)}..${addr.slice(-4)}</a>`;

  await loadChart();
  fetchWallet();
  updateTradeUI();
  document.getElementById('trade-amount').value = '';
  document.getElementById('limit-target').value = '';
  document.getElementById('trade-quote').style.display = 'none';
  document.getElementById('trade-status').textContent = '';
  onLimitTargetChange();
}

async function loadChart(fit = true) {
  if (!selectedAddr || !getSelectedPlayer()) return;

  const res = await fetch(`/api/chart/${selectedAddr}?tf=${currentTf}`);
  lastChartData = await res.json();
  renderChartData(fit);
  await loadTrades();
}

function renderChartData(fit = true) {
  if (!lastChartData) return;
  if (!chart || currentChartMode !== chartMode) {
    createChart();
    currentChartMode = chartMode;
  }
  lastLiveCandle = null;
  if (chartMode === 'candles') renderCandles();
  else renderLine();
  renderAvgLines();
  // Re-apply the live spot price on top of the freshly rebuilt data. The candles/line
  // come from the server's event cache, which lags up to 60s behind a fresh trade — without
  // this, every rebuild would snap the chart back to the last cached event's price.
  updateChartPrice();
  if (fit) chart.timeScale().fitContent();
}

function renderCandles() {
  const candles = lastChartData.candles || [];
  if (!candles.length) {
    mainSeries.setData([]);
    document.getElementById('st-high').textContent = '\u2014';
    document.getElementById('st-low').textContent = '\u2014';
    return;
  }

  const unit = unitLabel();

  mainSeries.setData(candles.map(c => ({
    time: c.time,
    open: applyPitchMultiplier(c.open),
    high: applyPitchMultiplier(c.high),
    low: applyPitchMultiplier(c.low),
    close: applyPitchMultiplier(c.close),
  })));
  if (candles.length > 0) lastSeriesTime = candles[candles.length - 1].time;

  const highs = candles.map(c => applyPitchMultiplier(c.high));
  const lows = candles.map(c => applyPitchMultiplier(c.low));
  document.getElementById('st-high').textContent = Math.max(...highs).toFixed(4) + ' ' + unit;
  document.getElementById('st-low').textContent = Math.min(...lows).toFixed(4) + ' ' + unit;

  // Markers on candles
  const tfMap = {'1m': 60, '5m': 300, '15m': 900, '1h': 3600, '4h': 14400, '1d': 86400};
  const interval = tfMap[currentTf] || 300;
  const points = lastChartData.points || [];
  const markers = [];
  for (const p of points) {
    if (p.type === 'spot') continue;
    const isMine = walletAddress && p.trader && p.trader.toLowerCase() === walletAddress.toLowerCase();
    if (isMine && !showMyTrades) continue;
    if (!isMine && !showAllTrades) continue;
    markers.push({
      time: Math.floor(p.time / interval) * interval,
      position: 'inBar',   // sit on the line/bar at the trade's price, not offset
      color: p.type === 'buy' ? '#3fb950' : '#f85149',
      shape: isMine ? (p.type === 'buy' ? 'arrowUp' : 'arrowDown') : 'circle',
      text: isMine ? (p.type === 'buy' ? 'B' : 'S') : '',
      size: isMine ? 1 : 0.5,
    });
  }
  markers.sort((a, b) => a.time - b.time);
  mainSeries.setMarkers(markers);
}

function renderLine() {
  const points = lastChartData.points || [];
  if (!points.length) {
    mainSeries.setData([]);
    document.getElementById('st-high').textContent = '\u2014';
    document.getElementById('st-low').textContent = '\u2014';
    return;
  }

  const unit = unitLabel();

  const seen = new Set();
  const lineData = [];
  for (const p of points) {
    let t = p.time;
    while (seen.has(t)) t++;
    seen.add(t);
    lineData.push({ time: t, value: applyPitchMultiplier(p.price) });
  }
  mainSeries.setData(lineData);
  if (lineData.length > 0) lastSeriesTime = lineData[lineData.length - 1].time;

  // Markers
  const markers = [];
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    if (p.type === 'spot') continue;
    const isMine = walletAddress && p.trader && p.trader.toLowerCase() === walletAddress.toLowerCase();
    if (isMine && !showMyTrades) continue;
    if (!isMine && !showAllTrades) continue;
    markers.push({
      time: lineData[i].time,
      position: 'inBar',   // sit on the line/bar at the trade's price, not offset
      color: p.type === 'buy' ? '#3fb950' : '#f85149',
      shape: isMine ? (p.type === 'buy' ? 'arrowUp' : 'arrowDown') : 'circle',
      text: isMine ? (p.type === 'buy' ? 'B' : 'S') : '',
      size: isMine ? 1 : 0.5,
    });
  }
  mainSeries.setMarkers(markers);

  const prices = points.map(p => applyPitchMultiplier(p.price));
  document.getElementById('st-high').textContent = Math.max(...prices).toFixed(4) + ' ' + unit;
  document.getElementById('st-low').textContent = Math.min(...prices).toFixed(4) + ' ' + unit;
}

function updateChartPrice() {
  if (!selectedAddr || !mainSeries || !chart) return;
  const tok = getSelectedPlayer();
  if (!tok) return;
  const spot = tok.kind === 'country' ? tok.pricePitch : tok.priceCountry;
  if (!(spot > 0)) return;
  const price = applyPitchMultiplier(spot);
  const now = Math.floor(Date.now() / 1000);

  if (chartMode === 'candles') {
    const tfMap = {'1m': 60, '5m': 300, '15m': 900, '1h': 3600, '4h': 14400, '1d': 86400};
    const interval = tfMap[currentTf] || 300;
    const bucket = Math.floor(now / interval) * interval;

    const candleTime = Math.max(bucket, lastSeriesTime);
    if (!lastLiveCandle || lastLiveCandle.time !== candleTime) {
      lastLiveCandle = { time: candleTime, open: price, high: price, low: price, close: price };
      lastSeriesTime = candleTime;
    } else {
      lastLiveCandle.high = Math.max(lastLiveCandle.high, price);
      lastLiveCandle.low = Math.min(lastLiveCandle.low, price);
      lastLiveCandle.close = price;
    }
    mainSeries.update(lastLiveCandle);
  } else {
    const t = Math.max(now, lastSeriesTime + 1);
    lastSeriesTime = t;
    mainSeries.update({ time: t, value: price });
  }

  updateHeaderPrice();
}

let tradesData = null;
let tradesTab = 'trades';

async function loadTrades() {
  if (!selectedAddr) return;
  const player = getSelectedPlayer();
  if (!player) return;

  try {
    const res = await fetch(`/api/trades/${selectedAddr}`);
    tradesData = await res.json();

    document.getElementById('tab-trades-count').textContent = `(${tradesData.totalTrades})`;
    document.getElementById('tab-wallets-count').textContent = `(${tradesData.wallets.length})`;
    const mw = tradesData.myWallet;
    const mwCount = (mw && mw.hasActivity) ? (mw.buys + mw.sells) : 0;
    document.getElementById('tab-mywallet-count').textContent = mwCount ? `(${mwCount})` : '';
    updateOrdersTabCount();   // Orders tab is per-token — refresh its count too

    renderTradesTab();
    renderAvgLines();
  } catch(e) {}
}

// Yellow dashed = avg buy price (cost basis); orange dashed = net position cost.
// Each line has its own toggle. Drawn for the configured wallet only, in the
// chart's current price unit.
function renderAvgLines() {
  if (!mainSeries) return;
  if (avgBuyLine) { try { mainSeries.removePriceLine(avgBuyLine); } catch(e) {} avgBuyLine = null; }
  if (avgNetLine) { try { mainSeries.removePriceLine(avgNetLine); } catch(e) {} avgNetLine = null; }
  if (!tradesData || !walletAddress) return;

  const mine = (tradesData.wallets || []).find(
    w => w.address && w.address.toLowerCase() === walletAddress.toLowerCase());
  if (!mine) return;

  if (showAvgBuy && mine.avgBuy > 0) {
    avgBuyLine = mainSeries.createPriceLine({
      price: applyPitchMultiplier(mine.avgBuy),
      color: '#e3b341', lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true, title: 'avg buy',
    });
  }
  if (showAvgNet && mine.avgNet > 0) {
    avgNetLine = mainSeries.createPriceLine({
      price: applyPitchMultiplier(mine.avgNet),
      color: '#f0883e', lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true, title: 'net pos',
    });
  }
}

function renderTradesTab() {
  const content = document.getElementById('trades-content');
  // Orders tab is global (all players) — render before the per-token guard.
  if (tradesTab === 'orders') { renderOrdersTab(content); return; }
  if (!tradesData) { content.innerHTML = '<div class="no-data">Select a player</div>'; return; }

  const player = getSelectedPlayer();
  if (!player) return;
  const baseUnit = player.kind === 'country' ? 'PITCH' : (player.country || '?');

  if (tradesTab === 'trades') {
    const trades = tradesData.trades;
    if (!trades.length) { content.innerHTML = '<div class="no-data">No trades yet</div>'; return; }

    const header = `<div class="trades-col-header trades-cols">
      <span>Type</span><span>Price</span><span>Amount</span><span>Total</span><span>Time</span><span>Wallet</span><span>Holds</span>
    </div>`;

    const rows = trades.slice(0, 200).map(e => `
      <div class="trade-row">
        <span class="${e.type}">${e.type.toUpperCase()}</span>
        <span>${(e.marketPrice ?? e.price).toFixed(4)}</span>
        <span>${e.tokenValue.toFixed(2)}</span>
        <span>${e.baseValue.toFixed(2)} ${baseUnit}</span>
        <span>${formatTime(e.timestamp)}</span>
        <span><a class="tx-link" href="https://basescan.org/tx/0x${e.tx}" target="_blank">${e.traderShort}</a></span>
        <span class="wallet-pos">${e.walletPosition > 0.01 ? e.walletPosition.toFixed(1) : '0'}</span>
      </div>
    `).join('');

    content.innerHTML = header + rows;
  } else if (tradesTab === 'wallets') {
    const wallets = tradesData.wallets.slice().sort((a, b) => b.position - a.position);
    if (!wallets.length) { content.innerHTML = '<div class="no-data">No holders</div>'; return; }

    const header = `<div class="trades-col-header wallets-cols">
      <span>Wallet</span><span>Buys</span><span>Sells</span><span>Position</span><span>Spent</span><span>Received</span>
    </div>`;

    const rows = wallets.map(w => {
      const posClass = w.position > 0.01 ? 'pos-positive' : 'pos-zero';
      return `
      <div class="wallet-row">
        <span><a class="tx-link" href="https://basescan.org/address/${w.address}" target="_blank">${w.short}</a></span>
        <span style="color:#3fb950">${w.buys}</span>
        <span style="color:#f85149">${w.sells}</span>
        <span class="${posClass}">${w.position.toFixed(2)}</span>
        <span>${w.spent.toFixed(2)}</span>
        <span>${w.received.toFixed(2)}</span>
      </div>`;
    }).join('');

    content.innerHTML = header + rows;
  } else if (tradesTab === 'mywallet') {
    renderMyWalletTab(content, baseUnit);
  }
}

// My Wallet tab — per-token summary for the wallet configured in .env.
function renderMyWalletTab(content, baseUnit) {
  const mw = tradesData.myWallet;
  if (!mw || !mw.configured) {
    content.innerHTML = '<div class="no-data">No wallet configured in .env</div>';
    return;
  }
  const shortAddr = mw.address.slice(0, 6) + '..' + mw.address.slice(-4);
  const headLink = `<a class="tx-link" href="https://basescan.org/address/${mw.address}" target="_blank">${shortAddr}</a>`;

  if (!mw.hasActivity) {
    content.innerHTML = `<div class="mw-section"><div class="mw-head">Wallet ${headLink}</div></div>`
      + '<div class="no-data" style="padding:30px">No activity on this token yet</div>';
    return;
  }

  const sign = v => (v > 0 ? '+' : '') + v.toFixed(2);
  const cls = v => v > 0 ? 'pos' : (v < 0 ? 'neg' : '');
  const fmtDate = ts => ts ? new Date(ts * 1000).toLocaleDateString() : '—';

  const cell = (label, value, valCls, sub, subCls) => `
    <div class="mw-cell">
      <div class="mw-label">${label}</div>
      <div class="mw-value ${valCls || ''}">${value}</div>
      ${sub ? `<div class="mw-sub ${subCls || ''}">${sub}</div>` : ''}
    </div>`;

  const grid = `<div class="mw-grid">
    ${cell('Position', mw.position.toFixed(2), '', `${mw.positionValue.toFixed(2)} ${baseUnit}`)}
    ${cell('Avg buy', mw.avgBuy.toFixed(4), '', `${baseUnit}/tok`)}
    ${cell('Break-even', mw.breakEven.toFixed(4), '',
           `${sign(mw.breakEvenDistPct)}% vs price`, cls(mw.breakEvenDistPct))}
    ${cell('Current price', mw.currentPrice.toFixed(4), '', `${baseUnit}/tok`)}
    ${cell('Realized PnL', sign(mw.realizedPnl), cls(mw.realizedPnl), baseUnit)}
    ${cell('Unrealized PnL', sign(mw.unrealizedPnl), cls(mw.unrealizedPnl), baseUnit)}
    ${cell('Total PnL', sign(mw.totalPnl), cls(mw.totalPnl),
           `${sign(mw.totalPnlPct)}%`, cls(mw.totalPnlPct))}
    ${cell('Fees paid', mw.feesPaid.toFixed(3), '', baseUnit)}
    ${cell('Ownership', mw.ownershipPct.toFixed(3) + '%', '', 'of supply')}
    ${cell('Holder rank', '#' + (mw.rank || '—'), '', `of ${mw.holdersCount}`)}
    ${cell('Trades', mw.buys + mw.sells, '',
           `<span style="color:#3fb950">${mw.buys}B</span> / <span style="color:#f85149">${mw.sells}S</span>`)}
    ${cell('Holding', mw.holdingDays.toFixed(1) + 'd', '', 'since ' + fmtDate(mw.firstTradeTs))}
  </div>`;

  const myTrades = (tradesData.trades || []).filter(
    t => t.trader && t.trader.toLowerCase() === mw.address.toLowerCase());
  let tradesHtml = '';
  if (myTrades.length) {
    const rows = myTrades.map(e => `
      <div class="mw-trade-row">
        <span class="${e.type}">${e.type.toUpperCase()}</span>
        <span>${(e.marketPrice ?? e.price).toFixed(4)}</span>
        <span>${e.tokenValue.toFixed(2)}</span>
        <span>${e.baseValue.toFixed(2)} ${baseUnit}</span>
        <span>${e.fee.toFixed(3)} fee</span>
        <span>${formatTime(e.timestamp)}</span>
      </div>`).join('');
    tradesHtml = `<div class="mw-trades-title">My trades (${myTrades.length}) — price excl. fee</div>`
      + `<div class="mw-trade-row mw-trade-head"><span></span><span>Price</span><span>Amount</span>`
      + `<span>Total</span><span>Fee</span><span>Time</span></div>` + rows;
  }

  content.innerHTML = `<div class="mw-section">`
    + `<div class="mw-head">Wallet ${headLink} · base unit: ${baseUnit}</div>${grid}</div>`
    + tradesHtml;
}

// --- Limit orders ---
let ordersData = null;
let ordersArmed = true;
let orderStatusSeen = {};   // id -> last seen status, drives fill/fail toasts
let reviewModalShown = new Set();   // review-order ids already surfaced in the modal

async function loadOrders() {
  try {
    const res = await fetch('/api/orders');
    const data = await res.json();
    let filled = false;
    (data.orders || []).forEach(o => {
      const prev = orderStatusSeen[o.id];
      if (prev && prev !== o.status && (o.status === 'filled' || o.status === 'failed')) {
        if (o.status === 'filled') {
          filled = true;
          showToast(`Order #${o.id} filled — ${o.side === 'buy' ? 'bought' : 'sold'} ${o.playerSymbol}`, 'filled');
        } else {
          showToast(`Order #${o.id} failed — ${o.playerSymbol}`, 'failed');
        }
      }
      orderStatusSeen[o.id] = o.status;
    });
    ordersData = data.orders || [];
    ordersArmed = data.armed;
    updateOrdersTabCount();
    if (tradesTab === 'orders') renderOrdersTab(document.getElementById('trades-content'));
    updateReviewModal();
    if (filled) { fetchWallet(); fetchPlayers(); }
  } catch(e) {}
}

// Per-token order count for the Orders tab badge (the global list lives in the profile).
function updateOrdersTabCount() {
  const el = document.getElementById('tab-orders-count');
  if (!el) return;
  if (!ordersData || !selectedAddr) { el.textContent = ''; return; }
  const n = ordersData.filter(o => o.player.toLowerCase() === selectedAddr.toLowerCase()
    && ['pending', 'executing', 'review'].includes(o.status)).length;
  el.textContent = n ? `(${n})` : '';
}

function renderOrdersTab(content) {
  if (!ordersData) { content.innerHTML = '<div class="no-data">Loading orders…</div>'; loadOrders(); return; }
  const player = getSelectedPlayer();
  if (!selectedAddr || !player) {
    content.innerHTML = '<div class="no-data">Select a player</div>';
    return;
  }
  // Per-token view — the full cross-token list is in the wallet profile.
  const orders = ordersData.filter(o => o.player.toLowerCase() === selectedAddr.toLowerCase());
  const pending = orders.filter(o => o.status === 'pending').length;
  const reviewN = orders.filter(o => o.status === 'review').length;

  let html = `<div class="orders-bar">
    <span class="ob-info">${orders.length} order(s) for ${player.symbol} · ${pending} pending${reviewN ? ` · ${reviewN} review` : ''}</span>
    <button class="${ordersArmed ? 'arm-toggle on' : 'arm-toggle'}" onclick="toggleArm()">
      <span>Auto-execution ${ordersArmed ? 'on' : 'off'}</span><span class="arm-switch"></span>
    </button>
  </div>`;
  if (!ordersArmed) html += '<div class="orders-warn">⚠ Auto-execution is OFF — pending orders will not fire.</div>';

  if (!orders.length) {
    content.innerHTML = html + '<div class="no-data" style="padding:30px">No limit orders for this token</div>';
    return;
  }

  html += `<div class="trades-col-header orders-cols">
    <span>Player</span><span>Type</span><span>Target</span><span>Amount</span><span>Status</span><span></span>
  </div>`;
  const kindLabel = {limit: 'LIMIT BUY', tp: 'TAKE-PROFIT'};
  html += orders.map(o => {
    const amtUnit = o.side === 'buy' ? o.country : o.playerSymbol;
    let status;
    if (o.status === 'filled' && o.tx) {
      status = `<a href="https://basescan.org/tx/0x${o.tx}" target="_blank">FILLED</a>`;
    } else if (o.status === 'failed') {
      status = `<span title="${(o.error || '').replace(/"/g, "'")}">FAILED</span>`;
    } else if (o.status === 'review') {
      status = `⚠ REVIEW −${reviewDeviation(o).toFixed(0)}%`;
    } else {
      status = o.status.toUpperCase();
    }
    let acts;
    if (o.status === 'review') {
      acts = `<div class="order-acts">
        <button class="order-btn exec" onclick="executeOrder(${o.id})">Execute</button>
        <button class="order-btn cxl" onclick="cancelOrder(${o.id})">Cancel</button>
      </div>`;
    } else if (o.status === 'pending') {
      acts = `<div class="order-acts"><button class="order-btn cxl" title="Cancel order" onclick="cancelOrder(${o.id})">&times;</button></div>`;
    } else {
      acts = '<span></span>';
    }
    return `<div class="order-row${o.status === 'review' ? ' is-review' : ''}">
      <span class="o-player" onclick="selectFromOrder('${o.player}')">${o.playerSymbol}</span>
      <span class="order-kind ${o.kind}">${kindLabel[o.kind] || o.kind}</span>
      <span>${o.targetPrice.toFixed(4)}</span>
      <span>${o.amount} ${amtUnit}</span>
      <span class="o-status ${o.status}">${status}</span>
      ${acts}
    </div>`;
  }).join('');
  content.innerHTML = html;
}

function selectFromOrder(addrLower) {
  const p = playersData.find(x => x.address.toLowerCase() === addrLower.toLowerCase());
  if (p) selectPlayer(p.address);
}

async function cancelOrder(id) {
  try {
    const res = await fetch(`/api/orders/${id}`, {method: 'DELETE'});
    const data = await res.json();
    if (data.error) showToast(data.error, 'failed');
  } catch(e) {}
  loadOrders();
}

// % the price fell below the order's target when it was held for review.
function reviewDeviation(o) {
  if (!o.reviewPrice || !o.targetPrice) return 0;
  return (o.targetPrice - o.reviewPrice) / o.targetPrice * 100;
}

async function executeOrder(id) {
  try {
    const res = await fetch(`/api/orders/${id}/execute`, {method: 'POST'});
    const data = await res.json();
    if (data.error) showToast(data.error, 'failed');
  } catch(e) {}
  loadOrders();
}

// Modal that surfaces limit buys held for review (price fell far below target).
function showReviewModal(reviewOrders) {
  document.getElementById('review-modal-body').innerHTML =
    '<p style="margin:0 0 12px;line-height:1.5">The price dropped well below the target '
    + 'on these limit buys, so they were <b>not</b> bought automatically. '
    + 'Execute anyway, or cancel:</p>'
    + reviewOrders.map(o => `
      <div class="modal-order">
        <div>
          <div class="mo-info">#${o.id} · ${o.playerSymbol} · ${o.amount} ${o.country}</div>
          <div class="mo-sub">target ${o.targetPrice.toFixed(4)} → paused at ${(o.reviewPrice || 0).toFixed(4)} ${o.country} (−${reviewDeviation(o).toFixed(0)}%)</div>
        </div>
        <div class="order-acts">
          <button class="order-btn exec" onclick="executeOrder(${o.id})">Execute</button>
          <button class="order-btn cxl" onclick="cancelOrder(${o.id})">Cancel</button>
        </div>
      </div>`).join('');
  document.getElementById('review-modal-overlay').classList.add('show');
}

function closeReviewModal() {
  document.getElementById('review-modal-overlay').classList.remove('show');
}

// Pop the modal when an order newly enters review; refresh or close it as the
// review orders are acted on.
function updateReviewModal() {
  const reviewOrders = (ordersData || []).filter(o => o.status === 'review');
  const overlay = document.getElementById('review-modal-overlay');
  const isOpen = overlay.classList.contains('show');
  if (!reviewOrders.length) { if (isOpen) closeReviewModal(); return; }
  const hasNew = reviewOrders.some(o => !reviewModalShown.has(o.id));
  reviewOrders.forEach(o => reviewModalShown.add(o.id));
  if (hasNew || isOpen) showReviewModal(reviewOrders);
}

async function toggleArm() {
  try {
    const res = await fetch('/api/orders/arm', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({armed: !ordersArmed}),
    });
    const data = await res.json();
    ordersArmed = data.armed;
  } catch(e) {}
  loadOrders();
}

let toastTimer = null;
function showToast(msg, kind) {
  const el = document.getElementById('order-toast');
  el.textContent = msg;
  el.className = `order-toast show ${kind || ''}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'order-toast'; }, 5000);
}

// --- Wallet profile (portfolio-wide view of the .env wallet) ---
let profileOpen = false;
let profileData = null;
let profileChart = null;

function toggleProfile() {
  if (profileOpen) closeProfile();
  else openProfile();
}

function openProfile() {
  profileOpen = true;
  document.body.classList.add('mode-profile');
  document.getElementById('wallet-chip').classList.add('active');
  loadProfile();
}

function closeProfile() {
  profileOpen = false;
  document.body.classList.remove('mode-profile');
  document.getElementById('wallet-chip').classList.remove('active');
  if (profileChart) { try { profileChart.remove(); } catch(e) {} profileChart = null; }
}

async function loadProfile(silent) {
  const view = document.getElementById('profile-view');
  if (!silent) view.innerHTML = '<div class="pf-empty">Loading profile…</div>';
  try {
    await loadOrders();
    const res = await fetch('/api/profile');
    profileData = await res.json();
  } catch(e) {
    if (!silent) view.innerHTML = '<div class="pf-empty">Failed to load profile</div>';
    return;
  }
  if (!profileData || !profileData.configured) {
    view.innerHTML = '<div class="pf-empty">No wallet configured — set WALLET_ADDRESS in .env</div>';
    return;
  }
  renderProfile();
}

// Action buttons for an order shown in the profile (mirrors the Orders tab).
function pfOrderActs(o) {
  if (o.status === 'review') {
    return `<div class="order-acts">
      <button class="order-btn exec" onclick="executeOrder(${o.id})">Execute</button>
      <button class="order-btn cxl" onclick="cancelOrder(${o.id})">Cancel</button></div>`;
  }
  if (o.status === 'pending') {
    return `<div class="order-acts"><button class="order-btn cxl" onclick="cancelOrder(${o.id})">Cancel</button></div>`;
  }
  return '';
}

function pfAllocRow(label, val, total) {
  const pct = total > 0 ? (val / total * 100) : 0;
  return `<div class="pf-alloc-row">
    <span class="pf-alloc-label">${label}</span>
    <div class="pf-alloc-bar"><div style="width:${Math.min(pct, 100)}%"></div></div>
    <span class="pf-alloc-val">${val.toFixed(1)} PITCH (${pct.toFixed(0)}%)</span>
  </div>`;
}

function renderProfile() {
  const d = profileData;
  const sign = v => (v >= 0 ? '+' : '') + v.toFixed(2);
  const cls = v => v > 0 ? 'pf-pos' : (v < 0 ? 'pf-neg' : '');
  const short = d.address.slice(0, 6) + '..' + d.address.slice(-4);
  const s = d.summary;
  const openOrders = (ordersData || []).filter(o => ['pending', 'review', 'executing'].includes(o.status));
  const total = s.totalValuePitch || 1;

  let h = `<div class="pf-head">
    <span class="pf-title">Wallet Profile</span>
    <a class="pf-addr" href="https://basescan.org/address/${d.address}" target="_blank">${short}</a>
    <div class="pf-actions">
      <button class="pf-btn" onclick="loadProfile(true)">⟳ Refresh</button>
      <button class="pf-btn" onclick="closeProfile()">✕ Close</button>
    </div>
  </div>`;

  h += `<div class="pf-section"><div class="pf-cards">
    <div class="pf-card"><div class="pf-label">Portfolio value</div>
      <div class="pf-value">${s.totalValuePitch.toFixed(2)}</div><div class="pf-sub">PITCH</div></div>
    <div class="pf-card"><div class="pf-label">Total PnL</div>
      <div class="pf-value ${cls(s.totalPnlPitch)}">${sign(s.totalPnlPitch)}</div>
      <div class="pf-sub">realized ${sign(s.realizedPnlPitch)} · unreal ${sign(s.unrealizedPnlPitch)}</div></div>
    <div class="pf-card"><div class="pf-label">ROI</div>
      <div class="pf-value ${cls(s.roiPct)}">${sign(s.roiPct)}%</div></div>
    <div class="pf-card"><div class="pf-label">Open positions</div>
      <div class="pf-value">${s.openPositions}</div>
      <div class="pf-sub">${openOrders.length} open order(s)</div></div>
    <div class="pf-card"><div class="pf-label">Fees paid</div>
      <div class="pf-value">${s.feesPaidPitch.toFixed(2)}</div><div class="pf-sub">PITCH</div></div>
  </div></div>`;

  h += `<div class="pf-section"><h3>Portfolio value over time</h3>
    <div class="pf-chart" id="pf-chart"></div></div>`;

  h += `<div class="pf-section"><h3>Open positions (${d.positions.length})</h3>`;
  if (d.positions.length) {
    h += `<table class="pf-table"><thead><tr>
      <th>Token</th><th>Qty</th><th>Avg buy</th><th>Price</th>
      <th>Value (PITCH)</th><th>Unrealized</th><th>Share</th></tr></thead><tbody>`
      + d.positions.map(p => `<tr class="clickable" onclick="selectFromProfile('${p.token}')">
        <td><span class="sym">${p.symbol}</span>${p.kind === 'country' ? ' <span style="color:#8b949e">·country</span>' : ''}</td>
        <td>${p.qty.toFixed(2)}</td><td>${p.avgBuy.toFixed(4)}</td><td>${p.currentPrice.toFixed(4)}</td>
        <td>${p.valuePitch.toFixed(2)}</td>
        <td class="${cls(p.unrealizedPnlPitch)}">${sign(p.unrealizedPnlPitch)} (${sign(p.unrealizedPct)}%)</td>
        <td>${p.sharePct}%</td></tr>`).join('') + `</tbody></table>`;
  } else h += '<div class="pf-empty">No open positions</div>';
  h += `</div>`;

  h += `<div class="pf-section"><h3>Open orders (${openOrders.length})</h3>`;
  if (openOrders.length) {
    const kl = {limit: 'LIMIT BUY', tp: 'TAKE-PROFIT'};
    h += `<table class="pf-table"><thead><tr>
      <th>Player</th><th>Type</th><th>Target</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>`
      + openOrders.map(o => `<tr>
        <td><span class="sym">${o.playerSymbol}</span></td><td>${kl[o.kind] || o.kind}</td>
        <td>${o.targetPrice.toFixed(4)}</td>
        <td>${o.amount} ${o.side === 'buy' ? o.country : o.playerSymbol}</td>

  h += `<div class="pf-section"><h3>Allocation</h3>`

  if (b.countries && b.countries.length) {
    h += `<div style="margin-top:10px;font-size:12px;color:#8b949e">Country tokens (dry powder): `
      + b.countries.map(c => `<span style="color:#e6edf3">${c.balance} ${c.symbol}</span>`).join(' · ') + `</div>`;
  }
  h += `</div>`;

  h += `<div class="pf-section"><h3>Closed positions (${d.closed.length})</h3>`;
  if (d.closed.length) {

      + d.closed.map(c => `<tr class="clickable" onclick="selectFromProfile('${c.token}')">
        <td><span class="sym">${c.symbol}</span></td><td>${c.buys}B / ${c.sells}S</td>
        <td class="${cls(c.realizedPnlPitch)}">${sign(c.realizedPnlPitch)} PITCH</td></tr>`).join('')
      + `</tbody></table>`;
  } else h += '<div class="pf-empty">No fully-closed positions</div>';
  h += `</div>`;

  h += `<div class="pf-section"><h3>Trade history (${d.trades.length}) — price excl. fee</h3>`;
  if (d.trades.length) {
    h += `<table class="pf-table"><thead><tr>
      <th>Time</th><th>Token</th><th>Type</th><th>Price</th><th>Amount</th>
      <th>Fee (PITCH)</th><th>Value (PITCH)</th></tr></thead><tbody>`
      + d.trades.slice(0, 150).map(t => `<tr>
        <td>${formatTime(t.timestamp)}</td><td><span class="sym">${t.symbol}</span></td>
        <td class="${t.type === 'buy' ? 'pf-pos' : 'pf-neg'}">${t.type.toUpperCase()}</td>
        <td>${(t.marketPrice ?? t.price).toFixed(4)}</td><td>${t.amount.toFixed(2)}</td>
        <td>${(t.feePitch ?? 0).toFixed(2)}</td>
        <td><a href="https://basescan.org/tx/0x${t.tx}" target="_blank">${t.valuePitch.toFixed(2)}</a></td></tr>`).join('')
      + `</tbody></table>`;
  } else h += '<div class="pf-empty">No trades</div>';
  h += `</div>`;

  document.getElementById('profile-view').innerHTML = h;
  buildProfileChart(d.valueSeries);
}

function buildProfileChart(series) {
  const el = document.getElementById('pf-chart');
  if (!el) return;
  if (profileChart) { try { profileChart.remove(); } catch(e) {} profileChart = null; }
  if (!series || series.length < 2) {
    el.innerHTML = '<div class="pf-empty" style="text-align:center;padding:95px 0">Not enough data for a chart</div>';
    return;
  }
  profileChart = LightweightCharts.createChart(el, {
    width: el.clientWidth, height: 220,
    layout: { background: {color: '#0d1117'}, textColor: '#8b949e' },
    grid: { vertLines: {color: '#21262d'}, horzLines: {color: '#21262d'} },
    timeScale: { timeVisible: true, borderColor: '#30363d' },
    rightPriceScale: { borderColor: '#30363d' },
  });
  const ser = profileChart.addAreaSeries({
    lineColor: '#58a6ff', topColor: 'rgba(88,166,255,0.4)',
    bottomColor: 'rgba(88,166,255,0.02)', lineWidth: 2,
  });
  ser.setData(series.map(p => ({time: p.time, value: p.value})));
  profileChart.timeScale().fitContent();
}

function selectFromProfile(addrLower) {
  const t = (playersData || []).find(x => x.address.toLowerCase() === addrLower.toLowerCase())
         || (countriesData || []).find(x => x.address.toLowerCase() === addrLower.toLowerCase());
  if (t) selectPlayer(t.address);
}

// --- Trading ---
let tradeSide = 'buy';
let tradeMode = 'market';   // 'market' or 'limit'
let walletInfo = null;
let quoteTimer = null;

function setTradeSide(side) {
  tradeSide = side;
  const buyBtn = document.getElementById('trade-buy-btn');
  const sellBtn = document.getElementById('trade-sell-btn');
  const submitBtn = document.getElementById('trade-submit');

  buyBtn.className = 'trade-side-btn' + (side === 'buy' ? ' buy-active' : '');
  sellBtn.className = 'trade-side-btn' + (side === 'sell' ? ' sell-active' : '');
  submitBtn.className = 'trade-submit ' + (side === 'buy' ? 'buy-btn' : 'sell-btn');

  updateTradeUI();
  onTradeAmountChange();
  onLimitTargetChange();
}

function setTradeMode(mode) {
  tradeMode = mode;
  document.getElementById('mode-market').classList.toggle('active', mode === 'market');
  document.getElementById('mode-limit').classList.toggle('active', mode === 'limit');
  document.getElementById('limit-fields').style.display = mode === 'limit' ? 'block' : 'none';
  if (mode === 'limit') document.getElementById('trade-quote').style.display = 'none';
  updateTradeUI();
  onTradeAmountChange();
  onLimitTargetChange();
}

// Live explanation of what the limit order will do, based on target vs spot price.
function onLimitTargetChange() {
  const hint = document.getElementById('limit-hint');
  const player = getSelectedPlayer();
  if (!player || player.kind === 'country') { hint.className = 'limit-hint'; hint.textContent = 'Select a player'; return; }
  const unit = player.country;
  const spot = player.priceCountry || 0;
  const target = parseFloat(document.getElementById('limit-target').value) || 0;
  document.getElementById('limit-target-label').textContent = `Target price (${unit})`;
  document.getElementById('limit-target-suffix').textContent = unit;
  if (target <= 0) { hint.className = 'limit-hint'; hint.textContent = `Current price: ${spot.toFixed(4)} ${unit}`; return; }

  if (tradeSide === 'buy') {
    if (target >= spot) {
      hint.className = 'limit-hint warn';
      hint.textContent = `⚠ Target ≥ current price (${spot.toFixed(4)}) — order fires immediately.`;
    } else {
      hint.className = 'limit-hint tp';
      hint.textContent = `Limit buy — buys when price falls to ${target.toFixed(4)} ${unit} (now ${spot.toFixed(4)}).`;
    }
  } else {
    if (target > spot) {
      hint.className = 'limit-hint tp';
      hint.textContent = `Take-profit — sells when price rises to ${target.toFixed(4)} ${unit} (now ${spot.toFixed(4)}).`;
    } else {
      hint.className = 'limit-hint warn';
      hint.textContent = `⚠ A sell order is take-profit only — target must be above the current price (${spot.toFixed(4)} ${unit}).`;
    }
  }
}

function updateTradeUI() {
  const player = getSelectedPlayer();
  const label = document.getElementById('trade-amount-label');
  const suffix = document.getElementById('trade-suffix');
  const submitBtn = document.getElementById('trade-submit');

  if (!player) {
    label.textContent = 'Amount';
    suffix.textContent = '—';
    submitBtn.textContent = 'Select a player';
    submitBtn.disabled = true;
    updateAvail();
    return;
  }

  if (player.kind === 'country') {
    label.textContent = 'Amount';
    suffix.textContent = '—';
    submitBtn.textContent = 'Country (view only)';
    submitBtn.disabled = true;
    updateAvail();
    return;
  }

  if (tradeSide === 'buy') {
    label.textContent = `Spend (${player.country})`;
    suffix.textContent = player.country;
    submitBtn.textContent = `Buy ${player.symbol}`;
  } else {
    label.textContent = `Sell (${player.symbol})`;
    suffix.textContent = player.symbol;
    submitBtn.textContent = `Sell ${player.symbol}`;
  }
  if (tradeMode === 'limit') submitBtn.textContent = 'Place limit order';
  submitBtn.disabled = !walletInfo || !walletInfo.connected;
  updateAvail();
}

// Wallet balance available for the current side: country tokens for buy, player
// tokens for sell. Returns 0 when not connected.
function availBalance() {
  if (!walletInfo || !walletInfo.connected) return 0;
  return tradeSide === 'buy' ? (walletInfo.countryBalance || 0)
                             : (walletInfo.playerBalance || 0);
}

// "Available: X" line under the amount field; turns red when the typed amount
// exceeds the balance. Drives both market trades and limit orders.
function updateAvail() {
  const el = document.getElementById('trade-avail');
  const player = getSelectedPlayer();
  if (!player || player.kind === 'country' || !walletInfo || !walletInfo.connected
      || walletInfo.countryBalance === undefined) {
    el.textContent = ''; el.className = 'trade-avail'; return;
  }
  const bal = availBalance();
  const unit = tradeSide === 'buy' ? player.country : player.symbol;
  const amount = parseFloat(document.getElementById('trade-amount').value) || 0;
  const over = amount > bal + 1e-4;
  el.className = 'trade-avail' + (over ? ' over' : '');
  el.textContent = over
    ? `⚠ Only ${bal.toFixed(4)} ${unit} available`
    : `Available: ${bal.toFixed(4)} ${unit}`;
}

// Returns an error string if `amount` exceeds the wallet balance, else null.
// The +1e-4 tolerance absorbs MAX-preset rounding.
function balanceError(amount) {
  const player = getSelectedPlayer();
  if (!player || !walletInfo || !walletInfo.connected) return null;
  const bal = availBalance();
  if (amount > bal + 1e-4) {
    const unit = tradeSide === 'buy' ? player.country : player.symbol;
    return `Not enough ${unit}: you have ${bal.toFixed(4)}`;
  }
  return null;
}

async function fetchWallet() {
  const url = selectedAddr ? `/api/wallet?player=${selectedAddr}` : '/api/wallet';
  try {
    const res = await fetch(url);
    walletInfo = await res.json();
    renderWalletInfo();
    updateTradeUI();
  } catch(e) {}
}

function renderWalletInfo() {
  const el = document.getElementById('trade-wallet-info');
  if (!walletInfo || !walletInfo.connected) {
    el.innerHTML = '<div class="trade-no-wallet">Add PRIVATE_KEY to .env</div>';
    return;
  }

  let html = `<div class="trade-wallet">
    <div class="wallet-addr">${walletInfo.addressShort}</div>
    <div class="wallet-bal">ETH: <span>${walletInfo.ethBalance.toFixed(4)}</span></div>`;

  if (walletInfo.countryBalance !== undefined) {
    html += `<div class="wallet-bal">${walletInfo.countrySymbol}: <span>${walletInfo.countryBalance.toFixed(4)}</span></div>`;
    html += `<div class="wallet-bal">${walletInfo.playerSymbol}: <span>${walletInfo.playerBalance.toFixed(4)}</span></div>`;
  }
  html += '</div>';
  el.innerHTML = html;
}

function setTradePreset(pct) {
  if (!walletInfo || !walletInfo.connected) return;
  // Truncate (don't round) so MAX never lands above the real balance.
  const amount = Math.floor(availBalance() * pct * 1e4) / 1e4;
  document.getElementById('trade-amount').value = amount.toFixed(4);
  onTradeAmountChange();
  updateAvail();
}

function onTradeAmountChange() {
  clearTimeout(quoteTimer);
  updateAvail();
  const amount = parseFloat(document.getElementById('trade-amount').value) || 0;
  if (amount <= 0 || !selectedAddr || isCountrySelected() || tradeMode === 'limit') {
    document.getElementById('trade-quote').style.display = 'none';
    return;
  }
  quoteTimer = setTimeout(() => fetchQuote(amount), 300);
}

let lastQuote = null;   // {amountOut, unit} of the last fetched quote — drives "min received"

async function fetchQuote(amount) {
  if (!selectedAddr) return;
  const player = getSelectedPlayer();
  if (!player) return;

  try {
    const res = await fetch(`/api/quote?player=${selectedAddr}&side=${tradeSide}&amount=${amount}`);
    const data = await res.json();
    if (data.error) {
      document.getElementById('trade-quote').style.display = 'none';
      lastQuote = null;
      return;
    }

    const quoteEl = document.getElementById('trade-quote');
    quoteEl.style.display = 'flex';

    const outUnit = tradeSide === 'buy' ? player.symbol : player.country;
    document.getElementById('tq-out').textContent = `${data.amountOut.toFixed(4)} ${outUnit}`;
    document.getElementById('tq-price').textContent =
      tradeSide === 'buy'
        ? `Your price (incl. 5% fee): ${data.price.toFixed(4)} ${player.country}/${player.symbol}`
        : `Your price (incl. 5% fee): ${(1/data.price).toFixed(4)} ${player.country}/${player.symbol}`;
    lastQuote = { amountOut: data.amountOut, unit: outUnit };
    renderMinReceived();
  } catch(e) {}
}

// Minimum you're guaranteed to receive after slippage — the actual on-chain floor
// (if the price moves more than this between now and the tx landing, it reverts).
function renderMinReceived() {
  const el = document.getElementById('tq-min');
  if (!el) return;
  if (!lastQuote || document.getElementById('trade-quote').style.display === 'none') {
    el.textContent = '';
    return;
  }
  const slippagePct = parseFloat(document.getElementById('trade-slippage').value) || 0.5;
  const min = lastQuote.amountOut * (1 - slippagePct / 100);
  el.textContent = `Min received: ${min.toFixed(4)} ${lastQuote.unit} · ${slippagePct}% slippage`;
}

async function executeTrade() {
  if (!selectedAddr || !walletInfo || !walletInfo.connected) return;

  const amount = document.getElementById('trade-amount').value;
  const slippagePct = parseFloat(document.getElementById('trade-slippage').value) || 0.5;
  const slippageBps = Math.round(slippagePct * 100);

  const statusEl = document.getElementById('trade-status');
  const submitBtn = document.getElementById('trade-submit');

  const balErr = balanceError(parseFloat(amount) || 0);
  if (balErr) { statusEl.className = 'trade-status error'; statusEl.textContent = balErr; return; }

  submitBtn.disabled = true;
  statusEl.className = 'trade-status pending';
  statusEl.textContent = tradeSide === 'buy' ? 'Buying...' : 'Selling...';

  try {
    const res = await fetch('/api/trade', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        player: selectedAddr,
        side: tradeSide,
        amount: amount,
        slippage: slippageBps,
      }),
    });
    const data = await res.json();

    if (data.error) {
      statusEl.className = 'trade-status error';
      // A revert here almost always means the price moved past your slippage.
      statusEl.textContent = /revert/i.test(data.error)
        ? 'Price moved — trade exceeded your slippage. Retry, or raise slippage.'
        : data.error;
      statusEl.title = data.error;
    } else if (data.success) {
      statusEl.className = 'trade-status success';
      statusEl.textContent = `Done! Got ${data.expectedOut.toFixed(4)}`;
      document.getElementById('trade-amount').value = '';
      document.getElementById('trade-quote').style.display = 'none';
      fetchWallet();
      fetchPlayers();
    } else {
      statusEl.className = 'trade-status error';
      statusEl.textContent = 'Price moved — trade exceeded your slippage. Retry, or raise slippage.';
    }
  } catch(e) {
    statusEl.className = 'trade-status error';
    statusEl.textContent = 'Network error';
  }
  submitBtn.disabled = false;
}

// Submit button dispatcher: market trade or limit order depending on mode.
function onTradeSubmit() {
  if (tradeMode === 'limit') createOrder();
  else executeTrade();
}

async function createOrder() {
  if (!selectedAddr || !walletInfo || !walletInfo.connected) return;
  const amount = parseFloat(document.getElementById('trade-amount').value) || 0;
  const target = parseFloat(document.getElementById('limit-target').value) || 0;
  const slippagePct = parseFloat(document.getElementById('trade-slippage').value) || 0.5;

  const statusEl = document.getElementById('trade-status');
  if (amount <= 0) { statusEl.className = 'trade-status error'; statusEl.textContent = 'Enter an amount'; return; }
  if (target <= 0) { statusEl.className = 'trade-status error'; statusEl.textContent = 'Enter a target price'; return; }
  const balErr = balanceError(amount);
  if (balErr) { statusEl.className = 'trade-status error'; statusEl.textContent = balErr; return; }

  const submitBtn = document.getElementById('trade-submit');
  submitBtn.disabled = true;
  statusEl.className = 'trade-status pending';
  statusEl.textContent = 'Placing order...';

  try {
    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        player: selectedAddr,
        side: tradeSide,
        targetPrice: target,
        amount: amount,
        slippage: Math.round(slippagePct * 100),
      }),
    });
    const data = await res.json();
    if (data.error) {
      statusEl.className = 'trade-status error';
      statusEl.textContent = data.error;
    } else {
      statusEl.className = 'trade-status success';
      statusEl.textContent = `Order #${data.order.id} placed`;
      document.getElementById('trade-amount').value = '';
      document.getElementById('limit-target').value = '';
      onLimitTargetChange();
      loadOrders();
    }
  } catch(e) {
    statusEl.className = 'trade-status error';
    statusEl.textContent = 'Network error';
  }
  submitBtn.disabled = false;
}

// --- SSE ---
function connectSSE() {
  if (sseSource) sseSource.close();
  sseSource = new EventSource('/api/stream');
  sseSource.onopen = () => document.getElementById('sse-dot').classList.remove('disconnected');
  sseSource.onmessage = async (event) => {
    const type = event.data.trim();
    if (type === 'prices') {
      await fetchPlayers();
      updateChartPrice();
      onTradeAmountChange();   // keep the trade-panel quote fresh (re-quotes if amount set)
    } else if (type === 'events' && selectedAddr) {
      await loadChart(false);
    } else if (type === 'orders') {
      if (profileOpen) loadProfile(true);
      else await loadOrders();
    }
  };
  sseSource.onerror = () => document.getElementById('sse-dot').classList.add('disconnected');
}

// Search

// Init

fetchWallet();
loadOrders();
connectSSE();
setInterval(() => {
  if (!sseSource || sseSource.readyState === EventSource.CLOSED) { fetchPlayers(); connectSSE(); }
}, 30000);
setInterval(() => { if (selectedAddr) loadChart(); }, 60000);
